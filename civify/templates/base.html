<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Civify{% endblock %}</title>
<style>
  :root { --ink:#1a1a1a; --muted:#555; --line:#d8d8d8; --ok:#1b6e3a; --warn:#9a3b00; --bg:#fff; --panel:#f5f5f5; }
  body { font: 17px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--bg); margin: 0; padding: 0 16px 48px; }
  main { max-width: 56rem; margin: 0 auto; }
  header { padding: 12px 0; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  header a { color: inherit; text-decoration: none; font-weight: 700; }
  h1 { font-size: 1.5rem; line-height: 1.25; }
  h2 { font-size: 1.15rem; margin-top: 1.6em; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
  .muted { color: var(--muted); font-size: .95rem; }
  .ok { color: var(--ok); font-weight: 700; } .warn { color: var(--warn); font-weight: 700; }
  .stage { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .stage li { list-style: none; padding: 10px 12px; border-left: 4px solid var(--line); background: var(--panel); }
  .stage li.current { border-left-color: var(--ok); }
  blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--line); color: var(--muted); font-size: .95rem; }
  .claim { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
  .claim.approved { border-color: var(--ok); } .claim.rejected { opacity: .6; }
  form.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  textarea { width: 100%; font: inherit; padding: 6px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  button.primary { background: var(--ok); color: #fff; border-color: var(--ok); }
  input[type=text] { font: inherit; padding: 6px; }
  .error { background: #fde8e8; border: 1px solid #c33; padding: 8px 12px; border-radius: 6px; }
  a { color: #0b57d0; }
  @media (prefers-color-scheme: dark) { :root { --ink:#eee; --muted:#bbb; --line:#444; --bg:#111; --panel:#1c1c1c; --ok:#5fcf85; --warn:#f0a060; } button { background:#222; color:#eee } button.primary { color:#111 } a { color:#8ab4f8 } .error { background:#3a1a1a } }
</style>
</head>
<body>
<main>
<header><a href="/">Civify</a> <span class="muted">· plain-language council decisions, checked against the record</span></header>
{% block body %}{% endblock %}
</main>
</body>
</html>
