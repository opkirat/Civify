[project]
name = "civify"
version = "0.1.0"
description = "Plain-language, source-verified municipal council decisions."
requires-python = ">=3.13"
dependencies = [
    "pypdf==7.0.1",
    "google-genai==3.3.0",
    "pydantic==2.14.3",
    "fastapi==0.121.2",
    "uvicorn==0.38.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "segno==1.6.6",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
